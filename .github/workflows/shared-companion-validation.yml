name: Shared companion validation
on:
  pull_request:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - name: Resolve development pin and format
        run: |
          cargo +stable generate-lockfile --manifest-path native/Cargo.toml
          cargo +stable fmt --manifest-path native/Cargo.toml --all
          python3 - <<'PY'
          import json,pathlib,base64,subprocess
          files=['native/Cargo.lock']+subprocess.check_output(['git','diff','--name-only']).decode().splitlines()
          values={p:pathlib.Path(p).read_text() for p in set(files) if p.endswith('.rs') or p=='native/Cargo.lock'}
          print('SEATLINE_SYNC_BEGIN'+base64.b64encode(json.dumps(values).encode()).decode()+'SEATLINE_SYNC_END')
          PY
      - run: cargo +stable clippy --manifest-path native/Cargo.toml --workspace --all-targets --locked -- -D warnings
      - run: cargo +stable test --manifest-path native/Cargo.toml --workspace --locked
