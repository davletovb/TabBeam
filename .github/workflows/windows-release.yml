name: Windows release candidate

on:
  workflow_dispatch:
    inputs:
      extension_id:
        description: Chrome Web Store extension ID paired with this installer
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Verify TabBeam repository rename
        shell: pwsh
        run: |
          if ($env:GITHUB_REPOSITORY -ne 'davletovb/tabbeam') {
            throw 'Rename the repository to davletovb/tabbeam before creating a TabBeam release candidate.'
          }
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: windows-release-cargo-${{ hashFiles('native/Cargo.lock') }}
      - name: Install pinned Inno Setup
        shell: pwsh
        run: choco install innosetup --version 6.7.1 --no-progress -y
      - name: Import code-signing certificate
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.WINDOWS_CODE_SIGN_PFX }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_CODE_SIGN_PFX_PASSWORD }}
        run: |
          if (-not $env:PFX_BASE64 -or -not $env:PFX_PASSWORD) {
            throw "Windows code-signing secrets are required"
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'tabbeam-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_BASE64))
          try {
            $password = ConvertTo-SecureString $env:PFX_PASSWORD -AsPlainText -Force
            $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
            if (-not $cert.Thumbprint) { throw "code-signing certificate import failed" }
            "TABBEAM_SIGN_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV
          }
          finally {
            Remove-Item -LiteralPath $pfx -Force -ErrorAction SilentlyContinue
          }
      - name: Build signed installer
        shell: pwsh
        env:
          EXTENSION_ID: ${{ inputs.extension_id }}
        run: |
          $signtool = (Get-Command signtool.exe -ErrorAction Stop).Source
          $env:TABBEAM_WINDOWS_SIGN_COMMAND = (
            '"' + $signtool + '" sign /sha1 ' + $env:TABBEAM_SIGN_THUMBPRINT +
            ' /fd sha256 /tr http://timestamp.digicert.com /td sha256 ' + '$f'
          )
          packaging/windows/build.ps1 -ExtensionId $env:EXTENSION_ID
      - name: Verify Authenticode signature
        shell: pwsh
        run: |
          $installer = Get-ChildItem out/windows/TabBeam-*-windows-x64.exe | Select-Object -First 1
          $signature = Get-AuthenticodeSignature -LiteralPath $installer.FullName
          if ($signature.Status -ne 'Valid') {
            throw "installer signature is $($signature.Status): $($signature.StatusMessage)"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: tabbeam-windows-x64-${{ github.sha }}
          path: out/windows/TabBeam-*-windows-x64.exe
          if-no-files-found: error
