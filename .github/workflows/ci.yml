name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  extension:
    name: Extension checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Lint
        run: npm --prefix extension run lint
      - name: Typecheck
        run: npm --prefix extension run typecheck
      - name: Build
        run: npm --prefix extension run build
      - name: Smoke tests
        run: npm --prefix extension test

  native-roundtrip:
    name: Extension to built host round trip
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Build host
        run: cargo +stable build --manifest-path native/Cargo.toml --locked
      - name: Exercise Native Messaging through popup
        run: npm --prefix extension run test:roundtrip

  macos-package:
    name: macOS package install and removal (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Build unsigned test package
        run: packaging/macos/build.sh abcdefghijklmnopabcdefghijklmnop
      - name: Install and verify Chrome registration
        shell: bash
        run: |
          sudo installer -pkg out/macos/*.pkg -target /
          mkdir -p "$RUNNER_TEMP/provider-bin"
          cat > "$RUNNER_TEMP/provider-bin/codex" <<'SH'
          #!/bin/sh
          if [ "$1" = "--version" ]; then echo 'codex-cli 0.1.0'; exit 0; fi
          echo 'Not logged in' >&2
          exit 1
          SH
          chmod +x "$RUNNER_TEMP/provider-bin/codex"
          PERVUE_PROVIDER_PATH="$RUNNER_TEMP/provider-bin" node packaging/macos/verify.mjs abcdefghijklmnopabcdefghijklmnop
          codesign --verify --strict '/Applications/Uninstall Pervue.app'
      - name: Verify fixed applet destination and reinstall
        shell: bash
        run: |
          pkgutil --expand out/macos/*.pkg "$RUNNER_TEMP/pervue-expanded"
          python3 - "$RUNNER_TEMP/pervue-expanded/PackageInfo" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          relocate = ET.parse(sys.argv[1]).getroot().find('relocate')
          assert relocate is None or len(relocate) == 0, 'uninstaller bundle is relocatable'
          PY
          sudo mv '/Applications/Uninstall Pervue.app' "$RUNNER_TEMP/Uninstall Pervue.app"
          sudo installer -pkg out/macos/*.pkg -target /
          test -d '/Applications/Uninstall Pervue.app'
          sudo rm -rf "$RUNNER_TEMP/Uninstall Pervue.app"
      - name: Remove and verify owned files
        shell: bash
        run: |
          sudo '/Library/Application Support/Pervue/uninstall.sh'
          test ! -e '/Library/Application Support/Pervue/pervue-host'
          test ! -e '/Library/Google/Chrome/NativeMessagingHosts/com.pervue.host.json'
          test ! -e '/Applications/Uninstall Pervue.app'

  windows-package:
    name: Windows package install and removal
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build unsigned test installer
        shell: pwsh
        run: packaging/windows/build.ps1 -ExtensionId abcdefghijklmnopabcdefghijklmnop
      - name: Install and verify Chrome registration
        shell: pwsh
        run: |
          $installer = Get-ChildItem out/windows/Pervue-*-windows-x64.exe | Select-Object -First 1
          $setup = Start-Process -FilePath $installer.FullName `
            -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-' `
            -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "installer failed with exit code $($setup.ExitCode)" }
          $provider = Join-Path $env:RUNNER_TEMP 'provider-bin'
          New-Item -ItemType Directory -Force -Path $provider | Out-Null
          @'
          @echo off
          if "%1"=="--version" (
            echo codex-cli 0.1.0
            exit /b 0
          )
          echo Not logged in 1>&2
          exit /b 1
          '@ | Set-Content -LiteralPath (Join-Path $provider 'codex.cmd') -Encoding ascii
          $env:PERVUE_PROVIDER_PATH = $provider
          node packaging/windows/verify.mjs abcdefghijklmnopabcdefghijklmnop
      - name: Uninstall and verify owned registration
        shell: pwsh
        run: |
          $uninstaller = Join-Path $env:LOCALAPPDATA 'Pervue\unins000.exe'
          if (-not (Test-Path -LiteralPath $uninstaller)) { throw "uninstaller not found" }
          $remove = Start-Process -FilePath $uninstaller `
            -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' `
            -Wait -PassThru
          if ($remove.ExitCode -ne 0) { throw "uninstaller failed with exit code $($remove.ExitCode)" }
          if (Test-Path -LiteralPath (Join-Path $env:LOCALAPPDATA 'Pervue')) {
            throw "Pervue install directory still exists"
          }
          $hive = [Microsoft.Win32.RegistryHive]::CurrentUser
          $view = [Microsoft.Win32.RegistryView]::Registry64
          $base = [Microsoft.Win32.RegistryKey]::OpenBaseKey($hive, $view)
          try {
            $key = $base.OpenSubKey('Software\Google\Chrome\NativeMessagingHosts\com.pervue.host')
            if ($null -ne $key) {
              $key.Dispose()
              throw "Native Messaging registry key still exists after uninstall"
            }
          }
          finally {
            $base.Dispose()
          }

  packaging-security:
    name: Packaged trust-boundary audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Audit packaged trust boundaries and extension permissions
        run: node packaging/security-audit.mjs

  protocol:
    name: Protocol fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install protocol validator
        run: npm --prefix scripts ci --ignore-scripts --no-audit --no-fund
      - name: Validate schemas and fixtures
        run: npm --prefix scripts run validate
      - name: Build native host for contract conformance
        run: cargo build --manifest-path native/Cargo.toml --locked
      - name: Validate built host against golden protocol
        run: npm --prefix scripts run validate:host -- --host native/target/debug/pervue-host

  native-msrv:
    name: Native minimum Rust (1.85)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v5
      - name: Install minimum supported Rust
        run: rustup toolchain install 1.85 --profile minimal
      - name: Test on minimum supported Rust
        run: cargo +1.85 test --workspace --locked

  native:
    name: Native ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    env:
      RUSTFLAGS: -D warnings
    defaults:
      run:
        shell: bash
        working-directory: native
    steps:
      - uses: actions/checkout@v5
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      # Packaged hosts ship the release profile, where overflow checks are off.
      - name: Test release profile
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --workspace --locked --release

  native-fuzz:
    name: Native fuzz smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install nightly Rust and cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal
          cargo install cargo-fuzz --locked --version 0.13.2
      - name: Generate structured fuzz corpora
        run: |
          node fuzz/fuzz-support.mjs frame-corpus fuzz/corpus/frame_reader
          node fuzz/fuzz-support.mjs protocol-corpus fuzz/corpus/protocol
          node fuzz/fuzz-support.mjs stream-corpus fuzz/corpus/stream_lines
      # fuzz-support.mjs derives -max_len from the shared frame limit in
      # docs/protocol/native-messaging-v1.json.
      - name: Smoke-run frame fuzz target
        run: |
          max_len=$(node fuzz/fuzz-support.mjs max-len frame_reader)
          cargo +nightly fuzz run frame_reader fuzz/corpus/frame_reader -- -runs=1000 -max_len="$max_len"
      - name: Smoke-run standalone stream fuzz target
        run: |
          max_len=$(node fuzz/fuzz-support.mjs max-len stream_lines)
          cargo +nightly fuzz run stream_lines fuzz/corpus/stream_lines -- -runs=1000 -max_len="$max_len"
      - name: Smoke-run protocol fuzz target
        run: |
          max_len=$(node fuzz/fuzz-support.mjs max-len protocol)
          cargo +nightly fuzz run protocol fuzz/corpus/protocol -- -runs=2000 -max_len="$max_len"
