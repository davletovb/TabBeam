name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  extension:
    name: Extension checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Lint
        run: npm --prefix extension run lint
      - name: Typecheck
        run: npm --prefix extension run typecheck
      - name: Build
        run: npm --prefix extension run build
      - name: Smoke tests
        run: npm --prefix extension test
      - name: Audit packaged trust boundaries
        run: node packaging/security-audit.mjs

  native-roundtrip:
    name: Extension to built host round trip
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Build host
        run: cargo +stable build --manifest-path native/Cargo.toml --locked
      - name: Exercise Native Messaging through popup
        run: npm --prefix extension run test:roundtrip

  macos-package:
    name: macOS package install and removal (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Build unsigned test package
        run: packaging/macos/build.sh abcdefghijklmnopabcdefghijklmnop
      - name: Install and verify Chrome registration
        shell: bash
        run: |
          sudo installer -pkg out/macos/*.pkg -target /
          mkdir -p "$RUNNER_TEMP/provider-bin"
          cat > "$RUNNER_TEMP/provider-bin/codex" <<'SH'
          #!/bin/sh
          if [ "$1" = "--version" ]; then echo 'codex-cli 0.1.0'; exit 0; fi
          echo 'Not logged in' >&2
          exit 1
          SH
          chmod +x "$RUNNER_TEMP/provider-bin/codex"
          TABBEAM_PROVIDER_PATH="$RUNNER_TEMP/provider-bin" node packaging/macos/verify.mjs abcdefghijklmnopabcdefghijklmnop
          codesign --verify --strict '/Applications/Uninstall TabBeam.app'
      - name: Verify fixed applet destination and reinstall
        shell: bash
        run: |
          pkgutil --expand out/macos/*.pkg "$RUNNER_TEMP/tabbeam-expanded"
          python3 - "$RUNNER_TEMP/tabbeam-expanded/PackageInfo" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          relocate = ET.parse(sys.argv[1]).getroot().find('relocate')
          assert relocate is None or len(relocate) == 0, 'uninstaller bundle is relocatable'
          PY
          sudo mv '/Applications/Uninstall TabBeam.app' "$RUNNER_TEMP/Uninstall TabBeam.app"
          sudo installer -pkg out/macos/*.pkg -target /
          test -d '/Applications/Uninstall TabBeam.app'
          sudo rm -rf "$RUNNER_TEMP/Uninstall TabBeam.app"
      - name: Remove and verify owned files
        shell: bash
        run: |
          sudo '/Library/Application Support/TabBeam/uninstall.sh'
          test ! -e '/Library/Application Support/TabBeam/tabbeam-host'
          test ! -e '/Library/Google/Chrome/NativeMessagingHosts/com.tabbeam.host.json'
          test ! -e '/Applications/Uninstall TabBeam.app'

  windows-package:
    name: Windows package install, upgrade and removal
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: windows-package-cargo-${{ hashFiles('native/Cargo.lock') }}
      - name: Install pinned Inno Setup
        shell: pwsh
        run: choco install innosetup --version 6.7.1 --no-progress -y
      - name: Reject non-canonical extension IDs before building
        shell: pwsh
        run: |
          $rejected = $false
          try {
            packaging/windows/build.ps1 -ExtensionId ABCDEFGHIJKLMNOPABCDEFGHIJKLMNOP
          }
          catch {
            $rejected = $true
          }
          if (-not $rejected) { throw "uppercase extension ID was accepted" }
      - name: Build unsigned test installer
        shell: pwsh
        run: packaging/windows/build.ps1 -ExtensionId abcdefghijklmnopabcdefghijklmnop
      - name: Reject install-directory overrides
        shell: pwsh
        run: |
          $installer = Get-ChildItem out/windows/TabBeam-*-windows-x64.exe | Select-Object -First 1
          $unsafe = Join-Path $env:RUNNER_TEMP 'tabbeam-unsafe-dir'
          $setup = Start-Process -FilePath $installer.FullName `
            -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-',"/DIR=$unsafe" `
            -Wait -PassThru
          if ($setup.ExitCode -eq 0) { throw "/DIR override unexpectedly succeeded" }
          if (Test-Path -LiteralPath (Join-Path $unsafe 'tabbeam-host.exe')) {
            throw "installer wrote the host to the overridden directory"
          }
      - name: Install and verify Chrome registration and npm discovery
        shell: pwsh
        run: |
          $installer = Get-ChildItem out/windows/TabBeam-*-windows-x64.exe | Select-Object -First 1
          $setup = Start-Process -FilePath $installer.FullName `
            -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-' `
            -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "installer failed with exit code $($setup.ExitCode)" }

          if (Get-Command codex -ErrorAction SilentlyContinue) {
            throw "runner unexpectedly has codex on PATH; npm-location discovery would be ambiguous"
          }
          $provider = Join-Path $env:APPDATA 'npm'
          New-Item -ItemType Directory -Force -Path $provider | Out-Null
          @'
          @echo off
          if "%1"=="--version" (
            echo codex-cli 0.1.0
            exit /b 0
          )
          echo Not logged in 1>&2
          exit /b 1
          '@ | Set-Content -LiteralPath (Join-Path $provider 'codex.cmd') -Encoding ascii

          node packaging/windows/verify.mjs abcdefghijklmnopabcdefghijklmnop
      - name: Upgrade while the native host is running
        shell: pwsh
        run: |
          $installer = Get-ChildItem out/windows/TabBeam-*-windows-x64.exe | Select-Object -First 1
          $marker = Join-Path $env:RUNNER_TEMP 'tabbeam-host-ready'
          Remove-Item $marker -Force -ErrorAction SilentlyContinue
          $node = (Get-Command node).Source
          $holder = Start-Process -FilePath $node `
            -ArgumentList 'packaging/windows/hold-host.mjs','abcdefghijklmnopabcdefghijklmnop',$marker `
            -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(20)
            while (-not (Test-Path -LiteralPath $marker)) {
              if ((Get-Date) -ge $deadline) { throw "running host fixture did not become ready" }
              Start-Sleep -Milliseconds 100
            }
            $setup = Start-Process -FilePath $installer.FullName `
              -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-' `
              -Wait -PassThru
            if ($setup.ExitCode -ne 0) { throw "upgrade failed with exit code $($setup.ExitCode)" }
            $holder.WaitForExit(15000)
            if (-not $holder.HasExited) { throw "upgrade left the old native host running" }
            node packaging/windows/verify.mjs abcdefghijklmnopabcdefghijklmnop
          }
          finally {
            if (-not $holder.HasExited) { Stop-Process -Id $holder.Id -Force -ErrorAction SilentlyContinue }
          }
      - name: Uninstall and verify owned registration
        shell: pwsh
        run: |
          $installDir = Join-Path $env:LOCALAPPDATA 'Programs\TabBeam'
          $stateDir = Join-Path $env:LOCALAPPDATA 'TabBeam'
          New-Item -ItemType Directory -Force -Path $stateDir | Out-Null
          $sentinel = Join-Path $stateDir 'package-uninstall-must-preserve.txt'
          Set-Content -LiteralPath $sentinel -Value 'preserve'

          $uninstaller = Join-Path $installDir 'unins000.exe'
          if (-not (Test-Path -LiteralPath $uninstaller)) { throw "uninstaller not found" }
          $remove = Start-Process -FilePath $uninstaller `
            -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' `
            -Wait -PassThru
          if ($remove.ExitCode -ne 0) { throw "uninstaller failed with exit code $($remove.ExitCode)" }
          if (Test-Path -LiteralPath $installDir) {
            throw "TabBeam install directory still exists"
          }
          if (-not (Test-Path -LiteralPath $sentinel)) {
            throw "uninstall removed TabBeam runtime state"
          }

          $hive = [Microsoft.Win32.RegistryHive]::CurrentUser
          $nativeKey = 'Software\Google\Chrome\NativeMessagingHosts\com.tabbeam.host'
          $uninstallKey = 'Software\Microsoft\Windows\CurrentVersion\Uninstall\{D7A1D4E8-774F-4E2B-A745-04B43E51A93C}_is1'
          foreach ($view in @(
            [Microsoft.Win32.RegistryView]::Registry64,
            [Microsoft.Win32.RegistryView]::Registry32
          )) {
            $base = [Microsoft.Win32.RegistryKey]::OpenBaseKey($hive, $view)
            try {
              $keys = @($uninstallKey)
              if ($view -eq [Microsoft.Win32.RegistryView]::Registry64) {
                $keys += $nativeKey
              }
              foreach ($subkey in $keys) {
                $key = $base.OpenSubKey($subkey)
                if ($null -ne $key) {
                  $key.Dispose()
                  throw "registry key still exists after uninstall in $view view: $subkey"
                }
              }
            }
            finally {
              $base.Dispose()
            }
          }

  protocol:
    name: Protocol fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install protocol validator
        run: npm --prefix scripts ci --ignore-scripts --no-audit --no-fund
      - name: Validate schemas and fixtures
        run: npm --prefix scripts run validate
      - name: Build native host for contract conformance
        run: cargo build --manifest-path native/Cargo.toml --locked
      - name: Validate built host against golden protocol
        run: npm --prefix scripts run validate:host -- --host native/target/debug/tabbeam-host

  runtime-independence:
    name: Runtime independence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: The provider runtime does not depend on TabBeam
        run: node scripts/check-runtime-independence.mjs

  native-msrv:
    name: Native minimum Rust (1.85)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v5
      - name: Install minimum supported Rust
        run: rustup toolchain install 1.85 --profile minimal
      - name: Test on minimum supported Rust
        run: cargo +1.85 test --workspace --locked

  native:
    name: Native ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    env:
      RUSTFLAGS: -D warnings
    defaults:
      run:
        shell: bash
        working-directory: native
    steps:
      - uses: actions/checkout@v5
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Test release profile
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --workspace --locked --release

  native-fuzz:
    name: Native fuzz smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install nightly Rust and cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal
          cargo install cargo-fuzz --locked --version 0.13.2
      - name: Generate structured fuzz corpora
        run: |
          node fuzz/fuzz-support.mjs frame-corpus fuzz/corpus/frame_reader
          node fuzz/fuzz-support.mjs protocol-corpus fuzz/corpus/protocol
          node seatline-fuzz/fuzz-support.mjs stream-corpus seatline-fuzz/corpus/stream_lines
      - name: Smoke-run frame fuzz target
        run: |
          max_len=$(node fuzz/fuzz-support.mjs max-len frame_reader)
          cargo +nightly fuzz run frame_reader fuzz/corpus/frame_reader -- -runs=1000 -max_len="$max_len"
      - name: Smoke-run the runtime's stream fuzz target
        run: |
          max_len=$(node seatline-fuzz/fuzz-support.mjs max-len stream_lines)
          cargo +nightly fuzz run --fuzz-dir seatline-fuzz stream_lines seatline-fuzz/corpus/stream_lines -- -runs=1000 -max_len="$max_len"
      - name: Smoke-run protocol fuzz target
        run: |
          max_len=$(node fuzz/fuzz-support.mjs max-len protocol)
          cargo +nightly fuzz run protocol fuzz/corpus/protocol -- -runs=2000 -max_len="$max_len"
