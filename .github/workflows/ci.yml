name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  extension:
    name: Extension checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Lint
        run: npm --prefix extension run lint
      - name: Typecheck
        run: npm --prefix extension run typecheck
      - name: Build
        run: npm --prefix extension run build
      - name: Smoke tests
        run: npm --prefix extension test

  protocol:
    name: Protocol fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validator
        run: python -m pip install --disable-pip-version-check jsonschema==4.25.1
      - name: Validate schemas and fixtures
        run: python scripts/validate_protocol.py

  native-linux:
    name: Native Linux (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - gcc
          - clang
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        env:
          CC: ${{ matrix.compiler }}
        run: cmake -S native -B native/build/ci -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build native/build/ci --parallel
      - name: Test
        run: ctest --test-dir native/build/ci --output-on-failure

  native-macos:
    name: Native macOS
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        env:
          CC: clang
        run: cmake -S native -B native/build/ci -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build native/build/ci --parallel
      - name: Test
        run: ctest --test-dir native/build/ci --output-on-failure

  native-windows:
    name: Native Windows (MSVC)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S native -B native/build/ci -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build native/build/ci --config Debug --parallel
      - name: Test
        run: ctest --test-dir native/build/ci -C Debug --output-on-failure

  native-sanitizers:
    name: Native ASan + UBSan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        env:
          CC: gcc
        run: cmake -S native -B native/build/sanitize -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Debug -DPERVUE_ENABLE_SANITIZERS=ON
      - name: Build
        run: cmake --build native/build/sanitize --parallel
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir native/build/sanitize --output-on-failure
