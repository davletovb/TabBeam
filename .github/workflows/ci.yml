name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  extension:
    name: Extension checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Lint
        run: npm --prefix extension run lint
      - name: Typecheck
        run: npm --prefix extension run typecheck
      - name: Build
        run: npm --prefix extension run build
      - name: Smoke tests
        run: npm --prefix extension test

  protocol:
    name: Protocol fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validator
        run: python -m pip install --disable-pip-version-check jsonschema==4.25.1
      - name: Validate schemas and fixtures
        run: python scripts/validate_protocol.py
      - name: Build native host for contract conformance
        run: cargo build --manifest-path native/Cargo.toml --locked
      - name: Validate built host against golden protocol
        run: python scripts/validate_host_protocol.py --host native/target/debug/pervue-host

  native-msrv:
    name: Native minimum Rust (1.85)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v5
      - name: Install minimum supported Rust
        run: rustup toolchain install 1.85 --profile minimal
      - name: Test on minimum supported Rust
        run: cargo +1.85 test --workspace --locked

  native:
    name: Native ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    env:
      RUSTFLAGS: -D warnings
    defaults:
      run:
        shell: bash
        working-directory: native
    steps:
      - uses: actions/checkout@v5
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      # Packaged hosts ship the release profile, where overflow checks are off.
      - name: Test release profile
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --workspace --locked --release

  native-fuzz:
    name: Native fuzz smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v5
      - name: Install nightly Rust and cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal
          cargo install cargo-fuzz --locked --version 0.13.2
      - name: Generate structured fuzz corpora
        run: |
          python3 fuzz/create_corpus.py fuzz/corpus/frame_reader
          python3 fuzz/create_protocol_corpus.py fuzz/corpus/protocol --fixtures ../docs/protocol/fixtures/v1-golden.json
      # -max_len follows max_frame_bytes in docs/protocol/native-messaging-v1.json
      # (1 MiB), plus the 4-byte length prefix for the frame reader.
      - name: Smoke-run frame fuzz target
        run: cargo +nightly fuzz run frame_reader fuzz/corpus/frame_reader -- -runs=1000 -max_len=1048580
      - name: Smoke-run protocol fuzz target
        run: cargo +nightly fuzz run protocol fuzz/corpus/protocol -- -runs=2000 -max_len=1048576
