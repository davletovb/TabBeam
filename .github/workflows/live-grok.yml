name: Live Grok smoke test

# The opt-in smoke test against the real Grok Build CLI (`grok`), through the
# runtime's Grok adapter (native/runtime-tests/tests/live_grok.rs). It runs only
# when started by hand, on a machine where `grok` is installed and signed in to
# an account: the adapter uses Grok's cached OAuth file (`GROK_AUTH_PATH`, or
# `~/.grok/auth.json`) and turns API-key billing off on purpose, so there is
# nothing to sign in with from an API-key secret, and a GitHub-hosted runner
# would only fail the check. Start it on a self-hosted runner that is set up
# that way, or add install and sign-in steps here once there is a supported
# non-interactive way to do both. The runner needs `rustup`, which the job uses
# to install the stable toolchain, and a fresh cached sign-in: an expired token
# reads as signed out, and running `grok models` once refreshes it.
on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Label of the runner with grok installed and signed in"
        required: true
        default: "self-hosted"
      mode:
        description: "required fails when grok is missing or signed out; 1 skips instead"
        required: true
        default: "required"
        type: choice
        options:
          - required
          - "1"

permissions:
  contents: read

concurrency:
  group: live-grok
  cancel-in-progress: false

jobs:
  live-grok:
    name: Real Grok smoke test
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Run the smoke test
        env:
          RUNTIME_LIVE_GROK: ${{ inputs.mode }}
        run: cargo +stable test --manifest-path native/Cargo.toml --locked -p runtime-tests --test live_grok -- --nocapture
