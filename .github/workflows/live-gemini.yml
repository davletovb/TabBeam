name: Live Gemini smoke test

# The opt-in smoke test against the real Antigravity CLI (`agy`), through the
# runtime's Gemini adapter (native/runtime-tests/tests/live_gemini.rs). It runs
# only when started by hand, on a machine where `agy` is installed and signed in
# to a Google account: the adapter uses Antigravity's own cached sign-in and
# passes no API key, so there is nothing to install or sign in with from a
# repository secret, and a GitHub-hosted runner would only fail the check. Start
# it on a self-hosted runner that is set up that way, or add install and
# sign-in steps here once there is a supported non-interactive way to do both.
# The runner needs `rustup`, which the job uses to install the stable toolchain.
on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Label of the runner with agy installed and signed in"
        required: true
        default: "self-hosted"
      mode:
        description: "required fails when agy is missing or signed out; 1 skips instead"
        required: true
        default: "required"
        type: choice
        options:
          - required
          - "1"

permissions:
  contents: read

concurrency:
  group: live-gemini
  cancel-in-progress: false

jobs:
  live-gemini:
    name: Real Antigravity smoke test
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Run the smoke test
        env:
          RUNTIME_LIVE_GEMINI: ${{ inputs.mode }}
        run: cargo +stable test --manifest-path native/Cargo.toml --locked -p runtime-tests --test live_gemini -- --nocapture
