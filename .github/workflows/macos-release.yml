name: macOS release candidate

on:
  workflow_dispatch:
    inputs:
      extension_id:
        description: Chrome Web Store extension ID paired with this package
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      # Temporary safety belt for the Pervue -> TabBeam cutover. Remove once
      # the repository rename has landed and the first TabBeam release is cut.
      - name: Verify TabBeam repository rename
        run: |
          repo_name="${GITHUB_REPOSITORY##*/}"
          if [[ "${repo_name,,}" != "tabbeam" ]]; then
            echo "Rename this repository to TabBeam before creating a TabBeam release candidate." >&2
            exit 1
          fi
      - name: Import Developer ID certificates
        env:
          APP_P12: ${{ secrets.MACOS_DEVELOPER_ID_APP_P12 }}
          INSTALLER_P12: ${{ secrets.MACOS_DEVELOPER_ID_INSTALLER_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          : "${APP_P12:?}" "${INSTALLER_P12:?}" "${CERT_PASSWORD:?}"
          keychain="$RUNNER_TEMP/tabbeam.keychain-db"
          security create-keychain -p "$CERT_PASSWORD" "$keychain"
          security unlock-keychain -p "$CERT_PASSWORD" "$keychain"
          security list-keychains -d user -s "$keychain"
          printf '%s' "$APP_P12" | base64 -D > "$RUNNER_TEMP/app.p12"
          printf '%s' "$INSTALLER_P12" | base64 -D > "$RUNNER_TEMP/installer.p12"
          security import "$RUNNER_TEMP/app.p12" -k "$keychain" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security import "$RUNNER_TEMP/installer.p12" -k "$keychain" -P "$CERT_PASSWORD" -T /usr/bin/pkgbuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$CERT_PASSWORD" "$keychain"
          rm -f "$RUNNER_TEMP/app.p12" "$RUNNER_TEMP/installer.p12"
      - name: Build signed package
        env:
          TABBEAM_APP_SIGN_IDENTITY: ${{ secrets.MACOS_DEVELOPER_ID_APP_IDENTITY }}
          TABBEAM_INSTALLER_SIGN_IDENTITY: ${{ secrets.MACOS_DEVELOPER_ID_INSTALLER_IDENTITY }}
          EXTENSION_ID: ${{ inputs.extension_id }}
        run: |
          set -euo pipefail
          : "${TABBEAM_APP_SIGN_IDENTITY:?}" "${TABBEAM_INSTALLER_SIGN_IDENTITY:?}"
          packaging/macos/build.sh "$EXTENSION_ID"
          pkgutil --check-signature out/macos/*.pkg
      - name: Notarize and staple
        env:
          NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER }}
        run: |
          set -euo pipefail
          : "${NOTARY_KEY:?}" "${NOTARY_KEY_ID:?}" "${NOTARY_ISSUER:?}"
          printf '%s' "$NOTARY_KEY" > "$RUNNER_TEMP/notary.p8"
          xcrun notarytool submit out/macos/*.pkg --key "$RUNNER_TEMP/notary.p8" \
            --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER" --wait
          rm -f "$RUNNER_TEMP/notary.p8"
          xcrun stapler staple out/macos/*.pkg
          xcrun stapler validate out/macos/*.pkg
      - uses: actions/upload-artifact@v4
        with:
          name: tabbeam-macos-universal-${{ github.sha }}
          path: out/macos/*.pkg
          if-no-files-found: error
