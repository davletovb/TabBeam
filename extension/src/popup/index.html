<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pervue</title>
    <link rel="stylesheet" href="./popup.css">
  </head>
  <body>
    <main class="popup-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Pervue</p>
          <h1>Ask from the browser.</h1>
        </div>
        <label class="theme-control" for="theme-select">
          <span>Theme</span>
          <select id="theme-select" aria-label="Theme">
            <option value="system">System</option>
            <option value="light">Light</option>
            <option value="dark">Dark</option>
          </select>
        </label>
      </header>

      <p id="provider-state" class="provider-state" role="status" aria-live="polite" hidden></p>
      <a id="companion-setup" class="setup-link" href="../setup/index.html" target="_blank" hidden>Companion setup</a>

      <nav class="conversation-nav" aria-label="Conversations">
        <label for="recent-conversations">Recent conversations</label>
        <select id="recent-conversations"><option value="">No recent conversations</option></select>
        <button id="new-conversation" class="secondary" type="button">New conversation</button>
      </nav>

      <section id="conversation-history" class="conversation-history" aria-label="Conversation history" aria-live="polite"></section>

      <form id="ask-form" class="composer">
        <label class="sr-only" for="ask-input">Ask anything</label>
        <textarea id="ask-input" rows="3" placeholder="Ask anything…"></textarea>
        <fieldset class="context-choices">
          <legend>Context for this question</legend>
          <button id="context-none" class="secondary" type="button">No context</button>
          <button id="context-selection" class="secondary" type="button">Use selection</button>
          <button id="context-page" class="secondary" type="button">Use this page</button>
        </fieldset>
        <p id="context-status" class="status" role="status" aria-live="polite"></p>
        <section id="context-preview" class="context-preview" aria-label="Context preview" hidden></section>
        <div class="request-actions">
          <button id="ask-submit" type="submit" aria-disabled="false">Ask</button>
          <button id="ask-cancel" class="secondary" type="button" hidden>Stop</button>
          <button id="ask-retry" class="secondary" type="button" hidden>Retry</button>
        </div>
      </form>

      <p id="status" class="status" role="status" aria-live="polite" aria-atomic="true"></p>

      <section id="answer" class="answer" aria-label="Answer" aria-busy="false" hidden></section>

      <button id="open-full-page" class="secondary" type="button" disabled>Continue in full view</button>

      <details id="diagnostics" class="diagnostics">
        <summary>Diagnostics</summary>
        <dl>
          <div><dt>Host</dt><dd id="diag-host">Not checked</dd></div>
          <div><dt>Protocol</dt><dd id="diag-protocol">Not checked</dd></div>
          <div><dt>Provider</dt><dd id="diag-provider">Not checked</dd></div>
          <div><dt>Recent failure</dt><dd id="diag-failure">None</dd></div>
        </dl>
        <button id="diag-refresh" class="secondary" type="button">Refresh diagnostics</button>
        <p class="diagnostic-note">Diagnostics exclude prompts, page text, selections, credentials, and provider output.</p>
      </details>
    </main>

    <script type="module" src="./popup.js"></script>
  </body>
</html>
