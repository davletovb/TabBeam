[package]
name = "pervue-host-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
pervue-host = { path = "../host" }
runtime-core = { path = "../runtime-core" }
serde_json = "1.0"

[[bin]]
name = "frame_reader"
path = "fuzz_targets/frame_reader.rs"
test = false
doc = false
bench = false

[[bin]]
name = "protocol"
path = "fuzz_targets/protocol.rs"
test = false
doc = false
bench = false

[[bin]]
name = "stream_lines"
path = "fuzz_targets/stream_lines.rs"
test = false
doc = false
bench = false

# The fuzz crate has its own workspace, so it does not inherit the main
# workspace's lints; it forbids `unsafe` itself.
[lints.rust]
unsafe_code = "forbid"

# Fuzz targets need nightly and libFuzzer, so they build in their own
# workspace instead of the main one.
[workspace]
members = ["."]
