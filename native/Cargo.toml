[workspace]
members = ["host", "test_provider"]
default-members = ["host"]
exclude = ["fuzz"]
resolver = "3"

[workspace.package]
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
seatline-companion = { git = "https://github.com/davletovb/seatline", rev = "a33a0c95bd00956abb3314c8b87a0151a127ef32", default-features = false }
seatline-core = { git = "https://github.com/davletovb/seatline", rev = "a33a0c95bd00956abb3314c8b87a0151a127ef32" }
seatline-platform = { git = "https://github.com/davletovb/seatline", rev = "a33a0c95bd00956abb3314c8b87a0151a127ef32" }
seatline-providers = { git = "https://github.com/davletovb/seatline", rev = "a33a0c95bd00956abb3314c8b87a0151a127ef32" }
seatline-scheduler = { git = "https://github.com/davletovb/seatline", rev = "a33a0c95bd00956abb3314c8b87a0151a127ef32" }
seatline-fake-provider = { git = "https://github.com/davletovb/seatline", rev = "a33a0c95bd00956abb3314c8b87a0151a127ef32" }

[workspace.lints.rust]
unsafe_code = "forbid"
