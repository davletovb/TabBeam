[workspace]
members = ["host", "test_provider"]
default-members = ["host"]
exclude = ["fuzz"]
resolver = "3"

[workspace.package]
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
seatline-companion = { git = "https://github.com/davletovb/seatline", rev = "928626e7fd853da1828fbdead5226f65b183a644" }
seatline-core = { git = "https://github.com/davletovb/seatline", rev = "928626e7fd853da1828fbdead5226f65b183a644" }
seatline-platform = { git = "https://github.com/davletovb/seatline", rev = "928626e7fd853da1828fbdead5226f65b183a644" }
seatline-providers = { git = "https://github.com/davletovb/seatline", rev = "928626e7fd853da1828fbdead5226f65b183a644" }
seatline-scheduler = { git = "https://github.com/davletovb/seatline", rev = "928626e7fd853da1828fbdead5226f65b183a644" }
seatline-fake-provider = { git = "https://github.com/davletovb/seatline", rev = "928626e7fd853da1828fbdead5226f65b183a644" }

[workspace.lints.rust]
unsafe_code = "forbid"
