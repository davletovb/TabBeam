[workspace]
members = ["host", "test_provider"]
default-members = ["host"]
exclude = ["fuzz"]
resolver = "3"

[workspace.package]
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
seatline-companion = { git = "https://github.com/davletovb/seatline", rev = "1bab40697bb3f9cba6431fe3c490a85e36981250" }
seatline-core = { git = "https://github.com/davletovb/seatline", rev = "1bab40697bb3f9cba6431fe3c490a85e36981250" }
seatline-platform = { git = "https://github.com/davletovb/seatline", rev = "1bab40697bb3f9cba6431fe3c490a85e36981250" }
seatline-providers = { git = "https://github.com/davletovb/seatline", rev = "1bab40697bb3f9cba6431fe3c490a85e36981250" }
seatline-scheduler = { git = "https://github.com/davletovb/seatline", rev = "1bab40697bb3f9cba6431fe3c490a85e36981250" }
seatline-fake-provider = { git = "https://github.com/davletovb/seatline", rev = "1bab40697bb3f9cba6431fe3c490a85e36981250" }

[workspace.lints.rust]
unsafe_code = "forbid"
