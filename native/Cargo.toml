[workspace]
members = ["host", "test_provider"]
default-members = ["host"]
exclude = ["fuzz"]
resolver = "3"

[workspace.package]
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
seatline-core = { git = "https://github.com/davletovb/seatline", rev = "e021c2acf05132073d82bf3e2149f1ff64f1f49f" }
seatline-platform = { git = "https://github.com/davletovb/seatline", rev = "e021c2acf05132073d82bf3e2149f1ff64f1f49f" }
seatline-providers = { git = "https://github.com/davletovb/seatline", rev = "e021c2acf05132073d82bf3e2149f1ff64f1f49f" }
seatline-scheduler = { git = "https://github.com/davletovb/seatline", rev = "e021c2acf05132073d82bf3e2149f1ff64f1f49f" }
seatline-fake-provider = { git = "https://github.com/davletovb/seatline", rev = "e021c2acf05132073d82bf3e2149f1ff64f1f49f" }

[workspace.lints.rust]
unsafe_code = "forbid"
