[workspace]
members = ["host", "test_provider"]
default-members = ["host"]
exclude = ["fuzz"]
resolver = "3"

[workspace.package]
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
seatline-companion = { git = "https://github.com/davletovb/seatline", rev = "dc1086582c8b98498aa48dae91c8d174bc3cfc3c", default-features = false }
seatline-core = { git = "https://github.com/davletovb/seatline", rev = "dc1086582c8b98498aa48dae91c8d174bc3cfc3c" }
seatline-platform = { git = "https://github.com/davletovb/seatline", rev = "dc1086582c8b98498aa48dae91c8d174bc3cfc3c" }
seatline-providers = { git = "https://github.com/davletovb/seatline", rev = "dc1086582c8b98498aa48dae91c8d174bc3cfc3c" }
seatline-scheduler = { git = "https://github.com/davletovb/seatline", rev = "dc1086582c8b98498aa48dae91c8d174bc3cfc3c" }
seatline-fake-provider = { git = "https://github.com/davletovb/seatline", rev = "dc1086582c8b98498aa48dae91c8d174bc3cfc3c" }

[workspace.lints.rust]
unsafe_code = "forbid"
