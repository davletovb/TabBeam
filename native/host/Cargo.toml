[package]
name = "pervue-host"
description = "Pervue Chrome Native Messaging host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "pervue_host"
path = "src/lib.rs"

[[bin]]
name = "pervue-host"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lints]
workspace = true
