[package]
name = "pervue-host"
description = "Pervue Chrome Native Messaging host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "pervue_host"
path = "src/lib.rs"

[[bin]]
name = "pervue-host"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Signals the process groups of provider processes (NAT-04), and tells whose
# directory Codex's workspace is (SEC-02).
[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false, features = ["signal", "user"] }

# kqueue, to see a provider exit before reaping it.
[target.'cfg(target_vendor = "apple")'.dependencies]
nix = { version = "0.31", default-features = false, features = ["event", "signal"] }

[lints]
workspace = true
