[package]
name = "tabbeam-host"
description = "TabBeam Chrome Native Messaging host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "tabbeam_host"
path = "src/lib.rs"

[[bin]]
name = "tabbeam-host"
path = "src/main.rs"

[dependencies]
seatline-core.workspace = true
seatline-platform.workspace = true
seatline-providers.workspace = true
seatline-scheduler.workspace = true
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lints]
workspace = true
