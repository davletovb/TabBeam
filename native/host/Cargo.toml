[package]
name = "pervue-host"
description = "Pervue Chrome Native Messaging host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "pervue_host"
path = "src/lib.rs"

[[bin]]
name = "pervue-host"
path = "src/main.rs"

[dependencies]
provider-runtime-scheduler = { path = "../scheduler" }
runtime-core = { path = "../runtime-core" }
runtime-platform = { path = "../platform" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lints]
workspace = true
