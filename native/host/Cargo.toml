[package]
name = "pervue-host"
description = "Pervue Chrome Native Messaging host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "pervue_host"
path = "src/lib.rs"

[[bin]]
name = "pervue-host"
path = "src/main.rs"

[dependencies]
provider-runtime-scheduler = { path = "../scheduler" }
runtime-core = { path = "../runtime-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Determines the owner of Codex's workspace (SEC-02).
[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false, features = ["user"] }

[lints]
workspace = true
