[package]
name = "runtime-tests"
description = "Integration tests for the provider runtime, run against the fake provider this package builds a binary of"
license = "MIT OR Apache-2.0"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "runtime-fake-provider"
path = "src/main.rs"

[dependencies]
runtime-fake-provider = { path = "../fake-provider" }

[dev-dependencies]
provider-runtime-scheduler = { path = "../scheduler" }
provider-runtime-service = { path = "../service" }
runtime-core = { path = "../runtime-core" }
runtime-platform = { path = "../platform" }
runtime-providers = { path = "../providers" }
serde_json = "1.0"

[target.'cfg(unix)'.dev-dependencies]
nix = { version = "0.31", default-features = false, features = ["process", "signal"] }

[lints]
workspace = true
