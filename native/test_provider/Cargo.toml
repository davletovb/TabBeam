[package]
name = "tabbeam-fake-provider"
description = "TabBeam's integration tests, and the fake provider binary they run"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "tabbeam-fake-provider"
path = "src/main.rs"

[dependencies]
seatline-fake-provider.workspace = true

[dev-dependencies]
# TabBeam's tests run the host, and the adapters it serves, against the fake
# provider this package builds a binary of.
tabbeam-host = { path = "../host" }
seatline-core.workspace = true
seatline-platform.workspace = true
seatline-providers.workspace = true
serde_json = "1.0"

[target.'cfg(unix)'.dev-dependencies]
nix = { version = "0.31", default-features = false, features = ["process", "signal"] }

[lints]
workspace = true
