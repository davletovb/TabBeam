[package]
name = "pervue-fake-provider"
description = "Pervue's integration tests, and the fake provider binary they run"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "pervue-fake-provider"
path = "src/main.rs"

[dependencies]
runtime-fake-provider = { path = "../fake-provider" }

[dev-dependencies]
# Pervue's tests run the host, and the adapters it serves, against the fake
# provider this package builds a binary of.
pervue-host = { path = "../host" }
runtime-core = { path = "../runtime-core" }
runtime-platform = { path = "../platform" }
runtime-providers = { path = "../providers" }
serde_json = "1.0"

[target.'cfg(unix)'.dev-dependencies]
nix = { version = "0.31", default-features = false, features = ["process", "signal"] }

[lints]
workspace = true
