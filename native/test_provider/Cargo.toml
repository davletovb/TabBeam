[package]
name = "pervue-fake-provider"
description = "Deterministic fake provider for Pervue native tests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "pervue-fake-provider"
path = "src/main.rs"

[dependencies]
# The fake `codex` persona prints JSON lines.
serde_json = "1.0"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false, features = ["resource", "signal"] }

[dev-dependencies]
# Host adapter tests use the host; process and stream integration tests import
# core directly and run against this crate's fake-provider binary.
pervue-host = { path = "../host" }
runtime-core = { path = "../runtime-core" }

[target.'cfg(unix)'.dev-dependencies]
nix = { version = "0.31", default-features = false, features = ["process", "signal"] }

[lints]
workspace = true
